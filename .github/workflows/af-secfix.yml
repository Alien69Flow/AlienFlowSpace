name: AF security bump
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch manifests
        run: |
          python3 - <<'PY'
          import sys

          def patch(path, old, new):
              s = open(path).read()
              if s.count(old) != 1:
                  sys.exit("%s: se esperaba 1 coincidencia, hay %d" % (path, s.count(old)))
              open(path, "w").write(s.replace(old, new))
              print("ok", path)

          patch(
              "package.json",
              '    "@walletconnect/jsonrpc-ws-connection": {\n      "ws": "^7.5.13"\n    }\n  }\n}\n',
              '    "@walletconnect/jsonrpc-ws-connection": {\n      "ws": "^7.5.13"\n    },\n    "follow-redirects": "^1.16.2"\n  }\n}\n',
          )

          patch(
              "package-lock.json",
              '    "node_modules/follow-redirects": {\n'
              '      "version": "1.16.0",\n'
              '      "resolved": "https://registry.npmjs.org/follow-redirects/-/follow-redirects-1.16.0.tgz",\n'
              '      "integrity": "sha512-y5rN/uOsadFT/JfYwhxRS5R7Qce+g3zG97+JrtFZlC9klX/W5hD7iiLzScI4nZqUS7DNUdhPgw4xI8W2LuXlUw==",\n',
              '    "node_modules/follow-redirects": {\n'
              '      "version": "1.16.2",\n'
              '      "resolved": "https://registry.npmjs.org/follow-redirects/-/follow-redirects-1.16.2.tgz",\n'
              '      "integrity": "sha512-/kVP2U8z596Ia0gwFrwyIeo74ta5aVmSeU1FfAUMAmcEP5EP7zydmag3SLiN64NaRKef3lxsq7i/g7ltJQDGow==",\n',
          )
          PY
      - name: Verify install
        run: |
          npm ci --no-audit --no-fund
          npm ls follow-redirects
      - name: Commit
        run: |
          rm .github/workflows/af-secfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump follow-redirects to 1.16.2 to clear CVE-2026-116689"
          git push
